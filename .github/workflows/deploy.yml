name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Keep the /setup/ zips fresh even when the site itself hasn't changed.
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://screensemble.com
          BASE_PATH: /

      # The setup page links stable names; drop the latest Performer release
      # assets next to it so Kodi's source browser sees them.
      - name: Fetch installer zips for /setup/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/setup
          gh release download --repo Screensemble/Performer \
            --pattern 'repository.screensemble-*.zip' \
            --pattern 'script.screensemble-*.zip' \
            --clobber --dir dist/setup
          cd dist/setup
          mv repository.screensemble-*.zip repository.screensemble.zip
          mv script.screensemble-*.zip script.screensemble.zip
          ls -la

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
